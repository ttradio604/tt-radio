<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        body {
            background-color: #0f0f0f; /* Темный фон */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Центрируем сам контейнер */
            align-items: center; 
        }

        /* Главный контейнер */
        .main-container {
            display: flex;
            justify-content: space-between; /* Расталкиваем левую и правую часть по краям */
            align-items: center; /* Центрируем по вертикали */
            gap: 40px; 
            width: 100%;
            max-width: 1400px; /* Ширина всего контента */
            padding: 40px 5%; /* Отступы по бокам (5% слева и справа) */
            box-sizing: border-box;
        }

        /* --- ЛЕВАЯ ЧАСТЬ (Лого, Текст, Кнопка) --- */
        .left-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Прижимаем текст и кнопку к левому краю */
            gap: 20px;
            flex: 0 1 400px; /* Занимает около 400px, не растягивается сильно */
        }

        /* Логотип */
        .logo {
            width: 180px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 10px;
            /* Убрали свечение */
        }

        /* Текст описания */
        .about-text {
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
            text-align: left; /* Текст выровнен по левому краю */
        }

        .about-text strong {
            color: #fff;
            font-size: 18px;
            display: block;
            margin-bottom: 10px;
        }

        /* Кнопка Поделиться */
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            cursor: pointer;
        }

        .share-btn:hover {
            background-color: #ff6600;
            color: #fff;
        }

        .share-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* --- ПРАВАЯ ЧАСТЬ (Кассета и Плеер) --- */
        .right-section {
            display: flex;
            flex-direction: column;
            align-items: center; /* Кассета и плеер по центру друг друга */
            gap: 30px;
            flex: 0 1 650px; /* Чуть больше места под кассету */
        }

        /* Кассета */
        .cassette-img {
            width: 100%;
            max-width: 550px; /* Размер кассеты */
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Плеер */
        .player-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .on-air {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .on-air-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .track-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            min-height: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Кнопка Play */
        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            box-shadow: 0 5px 20px rgba(255, 102, 0, 0.4);
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 30px; height: 30px; fill: white; margin-left: 4px; }
        .play-btn.playing svg { margin-left: 0; }

        /* Ползунок громкости */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            color: #888;
        }
        .volume-control svg { width: 18px; height: 18px; fill: #888; }
        input[type=range] {
            -webkit-appearance: none;
            width: 100px;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ff6600;
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }

        /* --- АДАПТИВ ДЛЯ ТЕЛЕФОНОВ (как было, чтобы не сломать) --- */
        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
                justify-content: center;
            }
            .left-section {
                align-items: center; /* На телефоне всё по центру */
                text-align: center;
                flex: 1 1 auto;
            }
            .about-text {
                text-align: center;
            }
            .right-section {
                flex: 1 1 auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- ЛЕВАЯ ЧАСТЬ (сдвинута влево) -->
        <div class="left-section">
            <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">
            <div class="about-text">
                <strong>TT Radio — твой личный портал в мир звука.</strong>
                Забудь о суете, надень наушники и позволь ритму вести тебя сквозь пространство и время.
            </div>
            
            <button class="share-btn" onclick="shareSite()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                Поделиться
            </button>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ (кассета и плеер на месте) -->
        <div class="right-section">
            <img src="TT%20Radio%20fon.png" alt="TT Radio Banner" class="cassette-img">
            
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>
                <div class="track-label">Сейчас играет</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <div class="volume-control">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');
        const volumeSlider = document.getElementById('volume-slider');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function shareSite() {
            if (navigator.share) {
                navigator.share({
                    title: 'TT Radio',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert('Скопируй ссылку: ' + window.location.href);
            }
        }

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
