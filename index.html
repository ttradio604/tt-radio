<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        body {
            background-color: #000000; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Главный контейнер на весь экран */
        .layout-container {
            display: flex;
            justify-content: space-between; /* Разносит блоки по краям */
            align-items: flex-start; /* Прижимает всё к верху */
            width: 100%;
            padding: 40px 60px; /* Отступы от краев экрана */
            box-sizing: border-box;
        }

        /* --- ЛЕВАЯ ЧАСТЬ (Логотип и текст) --- */
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
            max-width: 450px; /* Ограничиваем ширину текста */
        }

        /* Огромный логотип */
        .logo-container {
            width: 350px; 
            height: 350px;
            overflow: hidden;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.6); /* Зум, чтобы убрать белые поля картинки */
        }

        /* Текст под логотипом */
        .about-text {
            color: #ccc;
            line-height: 1.8;
            font-size: 18px;
            text-align: left;
        }

        /* --- ПРАВАЯ ЧАСТЬ (Кассета и плеер) --- */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Прижимает контент к правому краю */
            gap: 20px;
            max-width: 400px; /* Ширина правого блока */
        }

        /* Кассета */
        .cassette-img {
            width: 100%;
            max-width: 350px; /* Размер кассеты */
            height: auto;
            display: block;
        }

        /* Плеер */
        .player-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Текст и кнопка справа */
            text-align: right;
            width: 100%;
        }

        .on-air {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .on-air-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .track-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            min-height: 25px;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 26px; height: 26px; fill: white; margin-left: 3px; }
        .play-btn.playing svg { margin-left: 0; }

        /* --- АДАПТИВ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 900px) {
            .layout-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .left-panel, .right-panel {
                align-items: center;
                text-align: center;
                max-width: 100%;
            }
            .about-text { text-align: center; }
            .player-box { align-items: center; text-align: center; }
            .on-air { justify-content: center; }
            .logo-container { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <div class="layout-container">
        
        <!-- ЛЕВАЯ ЧАСТЬ -->
        <div class="left-panel">
            <div class="logo-container">
                <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">
            </div>
            
            <div class="about-text">
                Добро пожаловать на волну TT Radio!<br><br>
                Лучший транс, психоделика и chill-out.<br><br>
                Настраивайся на космос и наслаждайся эфиром.
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ -->
        <div class="right-panel">
            <!-- Кассета (справа вверху) -->
            <img src="TT%20Radio%20fon%201.png" alt="TT Radio Banner" class="cassette-img">
            
            <!-- Плеер (под кассетой) -->
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>
                <div class="track-label">Сейчас играет</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
