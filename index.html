<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        body {
            background-color: #000000; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        .main-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between; 
            align-items: flex-start; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 60px;
            box-sizing: border-box;
            flex: 1;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 20px;
            width: 600px; 
        }

        .logo {
            width: 525px; 
            height: 525px; 
            border-radius: 50%;
            margin-top: -40px;
            margin-bottom: 0px;
            margin-left: -120px; 
            object-fit: cover;
        }

        .logo.playing { animation: spin 8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .about-text {
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
            margin-top: -10px;
        }
        .about-text p { margin: 0 0 15px 0; }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .share-btn:hover { background-color: #ff6600; color: #fff; }
        .share-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .m3u-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .m3u-btn:hover {
            background-color: #333;
            border-color: #ff6600;
            color: #ff6600;
        }

        .qr-row {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-top: 15px;
            align-items: flex-start;
        }
        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .qr-image {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            background-color: #ffffff; 
            padding: 6px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.2); 
            display: block;
            transition: transform 0.2s;
        }
        .qr-image:hover { transform: scale(1.05); }
        .qr-caption {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 600px;
        }

        .cassette-img {
            width: 100%;
            height: auto;
            border-radius: 15px;
        }

        .player-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .on-air {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .on-air-dot {
            width: 8px; height: 8px;
            background-color: #ff4d4d; border-radius: 50%;
            margin-right: 8px; box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .track-title { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 15px; min-height: 30px; }

        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none; width: 70px; height: 70px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s; box-shadow: 0 5px 20px rgba(255, 102, 0, 0.4);
            margin-bottom: 15px;
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 30px; height: 30px; fill: white; margin-left: 4px; }
        .play-btn.playing svg { margin-left: 0; }
