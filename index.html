<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
        }

        /* Сетка для ПК: левая колонка узкая, правая широкая */
        .desktop-layout {
            display: grid;
            grid-template-columns: 350px 1fr; /* 350px на лого/текст, остальное на кассету */
            gap: 60px;
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            box-sizing: border-box;
            align-items: start; /* Прижимаем всё к верху */
        }

        /* --- ЛЕВАЯ КОЛОНКА (Лого и Текст) --- */
        .left-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Прижимаем к левому краю */
            gap: 30px;
        }

        /* Маленький аккуратный логотип в углу */
        .logo {
            width: 120px; /* Уменьшили размер */
            height: auto;
            border-radius: 50%;
        }

        .about-text {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
            color: #bbb;
            line-height: 1.6;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- ПРАВАЯ КОЛОНКА (Кассета и Плеер) --- */
        .right-column {
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем кассету и плеер */
            gap: 40px; /* Расстояние между кассетой и плеером */
        }

        /* Кассета (растягиваем на всю ширину правой колонки) */
        .cassette-img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Плеер (под кассетой) */
        .player-box {
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            text-align: center;
            width: 100%;
            max-width: 450px; /* Размер плеера */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Индикатор эфира */
        .on-air {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
        }
        .on-air-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            margin-top: 15px;
        }
        .track-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            min-height: 25px;
        }

        /* Кнопка Play */
        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 28px; height: 28px; fill: white; margin-left: 3px; }
        .play-btn.playing svg { margin-left: 0; }


        /* --- АДАПТИВ ДЛЯ ТЕЛЕФОНОВ --- */
        /* На телефоне всё выстроится в одну колонку (как ты и просил, потом проверим) */
        @media (max-width: 900px) {
            .desktop-layout {
                grid-template-columns: 1fr; /* Одна колонка */
                gap: 30px;
                padding: 20px;
            }
            .left-column {
                align-items: center; /* На телефоне лого и текст по центру */
            }
            .about-text {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="desktop-layout">
        
        <!-- ЛЕВАЯ ЧАСТЬ: Лого сверху, текст снизу -->
        <div class="left-column">
            <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">
            <div class="about-text">
                Добро пожаловать на волну TT Radio!<br><br>
                Лучший транс, психоделика и chill-out.<br><br>
                Настраивайся на космос и наслаждайся эфиром.
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: Кассета сверху, плеер снизу -->
        <div class="right-column">
            <img src="TT%20Radio%20fon.png" alt="TT Radio Banner" class="cassette-img">
            
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>
                <div class="track-label">Сейчас играет</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
