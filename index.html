<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio</title>
    <style>
        /* Чистый черный фон */
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px; /* Отступы от краев экрана */
        }

        /* Контейнер, который ставит блоки рядом */
        .container {
            display: flex;
            justify-content: space-between; /* Лого слева, кассета справа */
            align-items: flex-start; /* Выравнивание по верхнему краю */
            max-width: 1200px;
            margin: 0 auto; /* Центрируем сам контейнер на экране */
        }

        /* Левая колонка */
        .left-col {
            width: 350px; /* Фиксированная ширина */
        }

        .left-col img {
            width: 150px; /* Размер логотипа */
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .left-col h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .left-col p {
            color: #aaaaaa;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #ff6600;
            color: #ff6600;
            text-decoration: none;
            border-radius: 20px;
        }

        /* Правая колонка */
        .right-col {
            width: 600px; /* Ширина для кассеты */
            text-align: center; /* Плеер по центру */
        }

        .right-col img {
            width: 100%; /* Кассета на всю ширину колонки */
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* Стили для плеера */
        .player {
            margin-top: 10px;
        }

        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .play-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* Адаптив для телефонов (чтобы блоки вставали друг под другом) */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .left-col {
                width: 100%;
                text-align: center;
                margin-bottom: 40px;
            }
            .right-col {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Левая часть -->
        <div class="left-col">
            <img src="TT%20Radio%20logo.png" alt="Logo">
            <h2>TT Radio — твой личный портал в мир звука.</h2>
            <p>Забудь о суете, надень наушники и позволь ритму вести тебя сквозь пространство и время.</p>
            <a href="#" class="btn">Поделиться</a>
        </div>

        <!-- Правая часть -->
        <div class="right-col">
            <img src="TT%20Radio%20fon%201.png" alt="Cassette">
            
            <div class="player">
                <div style="color: #ff4d4d; font-size: 12px; margin-bottom: 5px;">● В ЭФИРЕ</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">▶ Слушать эфир</button>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸ Пауза';
            } else {
                audio.pause();
                playBtn.innerText = '▶ Слушать эфир';
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
