<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        /* Основной темный фон */
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Центрируем контент по вертикали */
        }

        /* Главный контейнер, который делит экран на 2 части */
        .main-container {
            display: flex;
            flex-wrap: wrap; /* Позволит переносить блоки, если экран узкий */
            justify-content: center;
            align-items: center;
            gap: 50px; /* Расстояние между левой и правой колонкой */
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            box-sizing: border-box;
        }

        /* --- ЛЕВАЯ КОЛОНКА (Логотип и Текст) --- */
        .left-panel {
            flex: 0 1 350px; /* Занимает около 350px, не растягивается сильно */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Аккуратный круглый логотип */
        .logo {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6); /* Легкая тень для объема */
        }

        /* Блок с текстом */
        .about-text {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
            color: #bbb;
            line-height: 1.6;
            font-size: 16px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- ПРАВАЯ КОЛОНКА (Кассета и Плеер) --- */
        .right-panel {
            flex: 1 1 600px; /* Занимает основное пространство */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* Расстояние между кассетой и плеером */
            max-width: 900px;
        }

        /* Яркая кассета */
        .cassette-img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* --- ПЛЕЕР (под кассетой) --- */
        .player-box {
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            text-align: center;
            width: 100%;
            max-width: 400px; /* Компактный размер */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Индикатор В эфире */
        .on-air {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
        }
        .on-air-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            margin-top: 15px;
        }
        .track-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            min-height: 25px;
        }

        /* Кнопка Play */
        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 25px; height: 25px; fill: white; margin-left: 3px; }
        .play-btn.playing svg { margin-left: 0; }

    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- ЛЕВАЯ ЧАСТЬ: Логотип и текст -->
        <div class="left-panel">
            <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">
            <div class="about-text">
                Добро пожаловать на волну TT Radio!<br><br>
                Лучший транс, психоделика и chill-out.<br><br>
                Настраивайся на космос и наслаждайся эфиром.
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: Кассета и плеер -->
        <div class="right-panel">
            <img src="TT%20Radio%20fon.png" alt="TT Radio Banner" class="cassette-img">
            
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>
                <div class="track-label">Сейчас играет</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt.radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt.radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
