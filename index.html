<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .banner {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            margin-top: -100px;
            border: 5px solid #121212;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }
        h1 {
            margin-top: 10px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
        }
        .play-button {
            background-color: #ff6600;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
        }
        .play-button:hover {
            background-color: #ff8533;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Здесь я поменял названия картинок на твои -->
    <img src="TT%20Radio%20fon.png" alt="TT Radio Banner" class="banner">
    <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">

    <h1>TT Radio</h1>
    <p>Транс от Keenetic</p>

    <a href="https://radio.tt-radio.netcraze.ru/TT_Radio.mp3" class="play-button" target="_blank">▶ Слушать эфир</a>

</body>
</html>
