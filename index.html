<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        /* Настройка фона */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            /* Кассета становится фоном на весь экран */
            background: linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.9)), 
                        url('TT%20Radio%20fon.png') no-repeat center center fixed;
            background-size: cover;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Главный контейнер по центру */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            width: 100%;
            max-width: 1300px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Левая часть (Логотип и текст) */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 320px;
        }

        /* Огромный логотип */
        .huge-logo {
            width: 100%;
            max-width: 450px; /* Сделали логотип большим */
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 102, 0, 0.3); /* Оранжевое свечение */
            border: 4px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .huge-logo:hover {
            transform: scale(1.02); /* Легкая анимация при наведении */
        }

        /* Текст под логотипом */
        .about-text {
            margin-top: 30px;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            color: #ddd;
            background: rgba(20, 20, 20, 0.6); /* Полупрозрачный фон */
            backdrop-filter: blur(10px); /* Эффект стекла */
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Правая часть (Плеер) */
        .right-side {
            flex: 1;
            min-width: 320px;
            display: flex;
            justify-content: center;
        }

        /* Стеклянный плеер */
        .player-box {
            background: rgba(20, 20, 20, 0.7); /* Полупрозрачный фон */
            backdrop-filter: blur(15px); /* Эффект стекла */
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        /* Индикатор эфира */
        .on-air {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .on-air-dot {
            width: 12px;
            height: 12px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 15px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        /* Информация о треке */
        .track-info {
            margin-top: 30px;
            margin-bottom: 40px;
        }
        .track-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .track-title {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            min-height: 35px;
        }

        /* Огромная кнопка Play */
        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(255, 102, 0, 0.5);
        }
        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(255, 102, 0, 0.7);
        }
        .play-btn svg {
            width: 40px;
            height: 40px;
            fill: white;
            margin-left: 6px;
        }
        .play-btn.playing svg {
            margin-left: 0;
        }
    </style>
</head>
<body>

    <!-- Основной контейнер -->
    <div class="main-container">
        
        <!-- Левая колонка: Логотип и текст -->
        <div class="left-side">
            <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="huge-logo">
            
            <div class="about-text">
                <!-- Твой текст здесь -->
                Добро пожаловать на волну TT Radio!<br>
                Лучший транс, психоделика и chill-out.<br>
                Настраивайся на космос и наслаждайся эфиром.
            </div>
        </div>

        <!-- Правая колонка: Плеер -->
        <div class="right-side">
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>

                <div class="track-info">
                    <div class="track-label">Сейчас играет</div>
                    <div class="track-title" id="track-title">Загрузка...</div>
                </div>

                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Скрипт плеера и названий -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        if (title && title !== "Unknown") {
                            trackTitle.innerText = title;
                        } else {
                            trackTitle.innerText = "TT Radio Live";
                        }
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
