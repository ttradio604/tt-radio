<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Radio - Trance from Keenetic</title>
    <style>
        /* Чисто черный фон */
        body {
            background-color: #000000; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Сетка */
        .layout-container {
            display: grid;
            grid-template-columns: 350px 1fr; 
            gap: 60px;
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            box-sizing: border-box;
            align-items: center;
        }

        /* ЛЕВАЯ ЧАСТЬ */
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
        }

        .logo {
            width: 140px; 
            height: auto;
            border-radius: 50%;
        }

        /* Текст без подложки, просто на фоне */
        .about-text {
            color: #ccc;
            line-height: 1.8;
            font-size: 16px;
            width: 100%;
        }

        /* ПРАВАЯ ЧАСТЬ */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        /* Кассета */
        .cassette-img {
            width: 100%;
            max-width: 850px;
            height: auto;
            display: block;
        }

        /* Плеер без рамок и фона */
        .player-box {
            text-align: center;
            width: 100%;
            max-width: 450px;
            position: relative;
            padding-top: 20px;
        }

        /* Индикатор эфира */
        .on-air {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff4d4d;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .on-air-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .track-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .track-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            min-height: 30px;
        }

        /* Кнопка Play */
        .play-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
            margin: 0 auto;
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn svg { width: 30px; height: 30px; fill: white; margin-left: 4px; }
        .play-btn.playing svg { margin-left: 0; }

        /* Адаптив для телефонов */
        @media (max-width: 900px) {
            .layout-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 40px;
            }
            .left-panel { align-items: center; text-align: center; }
            .right-panel { gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="layout-container">
        
        <!-- ЛЕВАЯ ЧАСТЬ -->
        <div class="left-panel">
            <img src="TT%20Radio%20logo.png" alt="TT Radio Logo" class="logo">
            <div class="about-text">
                Добро пожаловать на волну TT Radio!<br><br>
                Лучший транс, психоделика и chill-out.<br><br>
                Настраивайся на космос и наслаждайся эфиром.
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ -->
        <div class="right-panel">
            
            <!-- Новая вырезанная кассета -->
            <img src="TT%20Radio%20fon%201.png" alt="TT Radio Banner" class="cassette-img">
            
            <!-- Плеер -->
            <div class="player-box">
                <div class="on-air">
                    <div class="on-air-dot"></div> В эфире
                </div>
                <div class="track-label">Сейчас играет</div>
                <div class="track-title" id="track-title">Загрузка...</div>
                
                <audio id="radio-stream" src="https://radio.tt-radio.netcraze.pro/TT_Radio.mp3" preload="none"></audio>
                
                <button class="play-btn" id="play-button">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>

        </div>

    </div>

    <!-- Скрипт плеера -->
    <script>
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const trackTitle = document.getElementById('track-title');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        function fetchTrackInfo() {
            fetch('https://radio.tt-radio.netcraze.pro/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    try {
                        let title = data.icestats.source.title;
                        trackTitle.innerText = (title && title !== "Unknown") ? title : "TT Radio Live";
                    } catch (e) {
                        trackTitle.innerText = "TT Radio Live";
                    }
                })
                .catch(error => {
                    trackTitle.innerText = "TT Radio Live";
                });
        }

        setInterval(fetchTrackInfo, 5000);
        fetchTrackInfo();
    </script>

</body>
</html>
